<body>
<header class="topbar">
  <a class="brand" href="./" aria-label="Meme Generator">
    <span class="brand-emoji" aria-hidden="true">😂</span>
    <span class="brand-name">Meme Generator</span>
  </a>
  <label class="lang-picker">
    <span class="visually-hidden">Language</span>
    <select id="langSelect" aria-label="Language">
      <option value="en">English</option>
      <option value="zh" selected>简体中文</option>
      <option value="es">Español</option>
      <option value="pt">Português</option>
      <option value="ja">日本語</option>
      <option value="de">Deutsch</option>
      <option value="fr">Français</option>
    </select>
  </label>
</header>

<main class="layout">
  <section class="stage-col">
    <div class="stage" id="stage">
      <canvas id="canvas" width="880" height="880"></canvas>
      <div class="stage-loading" id="stageLoading">…</div>
    </div>
    <p class="hint">拖动文字可以移动位置；拖右下角的橙色手柄，或者双指捏合，可以放大缩小。</p>
    <div class="download-row">
      <button type="button" class="btn btn-primary" id="btnPng">下载 PNG</button>
      <button type="button" class="btn" id="btnJpg">下载 JPG</button>
    </div>
  </section>

  <aside class="panel">
    <section class="card">
      <h2>模板</h2>
      <div class="source-row">
        <label class="btn btn-accent file-btn">
          上传图片
          <input type="file" id="fileInput" accept="image/*" hidden>
        </label>
        <div class="blank-box">
          <select id="blankSize" aria-label="空白画布">
            <option value="1080x1080">1:1 · 1080×1080</option>
            <option value="1080x1350">4:5 · 1080×1350</option>
            <option value="1920x1080">16:9 · 1920×1080</option>
            <option value="1080x1920">9:16 · 1080×1920</option>
          </select>
          <button type="button" class="btn" id="btnBlank">空白画布</button>
        </div>
      </div>
      <div class="tpl-strip" id="tplStrip" role="listbox" aria-label="模板"></div>
    </section>

    <section class="card" id="textCard">
      <h2>文字</h2>
      <button type="button" class="btn btn-accent btn-block" id="btnAddText">＋ 添加文字</button>
      <div class="field">
        <label for="textInput">文字</label>
        <textarea id="textInput" rows="2"></textarea>
      </div>
      <div class="field">
        <label for="fontSelect">字体</label>
        <select id="fontSelect">
          <option value="pressuru">Pressuru (Meme)</option>
          <option value="oswald">Oswald</option>
          <option value="impact">Impact / Arial Black</option>
          <option value="sans">Sans</option>
          <option value="serif">Serif</option>
          <option value="mono">Mono</option>
        </select>
      </div>
      <div class="field">
        <label for="sizeRange">字号 · <output id="sizeOut">64</output></label>
        <input type="range" id="sizeRange" min="12" max="360" value="64">
      </div>
      <div class="field two-col">
        <div>
          <label for="fillColor">文字颜色</label>
          <input type="color" id="fillColor" value="#ffffff">
        </div>
        <div>
          <label for="strokeColor">描边颜色</label>
          <input type="color" id="strokeColor" value="#000000">
        </div>
      </div>
      <div class="field">
        <label for="strokeRange">描边粗细 · <output id="strokeOut">8</output></label>
        <input type="range" id="strokeRange" min="0" max="30" step="0.5" value="8">
      </div>
      <div class="field">
        <label>对齐</label>
        <div class="segmented" id="alignGroup" role="group" aria-label="对齐">
          <button type="button" data-align="left">左</button>
          <button type="button" data-align="center" class="active">中</button>
          <button type="button" data-align="right">右</button>
        </div>
      </div>
      <button type="button" class="btn btn-danger btn-block" id="btnDelete">删除文字</button>
    </section>
  </aside>
</main>

<section class="how">
  <h1>免费梗图生成器</h1>
  <p>选一张模板或上传自己的图片，加上文字，拖到想要的位置就能下载。全程在浏览器里完成，图片不会离开你的设备。</p>
  <ol>
    <li>选模板，或者上传一张图片</li>
    <li>添加文字，拖动移动，拖右下角或双指捏合缩放</li>
    <li>下载 PNG 或 JPG，拿去分享</li>
  </ol>
</section>

<footer class="footer">
  <p>永久免费，无需注册。基于 George Raptis 的开源项目 meme-generator（MIT 协议）改造。</p>
  <p><a href="https://github.com/TonyWoo/meme-generator">GitHub</a> · <a href="https://github.com/georapbox/meme-generator">Upstream</a></p>
</footer>
